version: '3.8'

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: gitlab.local
    ports:
      - "8443:443"
      - "8080:80"
      - "2222:22"
    shm_size: "512m"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url "http://localhost:8080";
        gitlab_rails["initial_root_password"] = "Passw0rd!";
    volumes:
      - ./config:/etc/gitlab
      - ./logs:/var/log/gitlab
      - ./data:/var/opt/gitlab